name: Розыгрыши Pepsi

on:
  schedule:
    # 13:10 UTC = 18:10 по Ташкенту (UTC+5) — после времени розыгрыша 18:00
    - cron: '10 13 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: 'Провести ВСЕ непроведённые розыгрыши (для теста, без учёта даты)'
        type: boolean
        default: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установка зависимостей
        working-directory: Backend
        run: pip install -r requirements.txt
      - name: Проведение розыгрышей
        working-directory: Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ci-draw-key
          DEBUG: 'False'
          ALLOWED_HOSTS: '*'
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            python manage.py draw --all
          else
            python manage.py draw
          fi
